# mainへのpushとプルリクエストで、バックエンドとフロントエンドのチェックを並行して実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しく実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint / Larastan / Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 本番と同じPostgreSQLでテストする(部分ユニークインデックスなどPostgreSQL特有の機能を使うため)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tech_match_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Dockerfileと同じPHPのバージョンと拡張(GDは画像の縮小、exifは写真の向きの読み取りに使う)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, gd, exif, intl, zip
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (format)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: composer analyse

      - name: Pest (tests)
        run: php artisan test --compact
        env:
          # .env.exampleのDB_HOSTはdocker composeのサービス名のため、CIのPostgreSQLに向ける
          DB_HOST: 127.0.0.1

  frontend:
    name: Frontend (ESLint / Prettier / tsc / Vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # next.config.tsが読む環境変数(型の生成・ビルドで使う)。
    # ビルドは本番のビルド環境と同じく、Laravelに繋がらない状態で行い、ビルド中にAPIを呼ぶページがあれば失敗させる
    env:
      API_INTERNAL_URL: http://127.0.0.1:9
      SITE_URL: http://localhost:3000
      REVALIDATE_SECRET: ci-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # PagePropsなどのルートの型は、Next.jsが.next/typesに生成する(手元ではnext devが作るが、CIでは先に作る)
      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
