services:
  # Laravel API(Nginx + PHP-FPM)。backend/Dockerfileのfinalステージを使い、
  # ソースはvolumeマウントで上書きして開発する
  app:
    build:
      context: ./backend
      target: final
    ports:
      - "8000:8080"
    # backend/.envはvolumeマウントでLaravelが直接読み込む。env_fileで環境変数としても渡すと、
    # テスト時にphpunit.xmlの値(テスト用DB等)より優先されてしまうため、渡さない
    environment:
      PORT: "8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Next.js(開発サーバー)。MacのDockerではファイルの変更が開発サーバーに伝わりにくいため、
  # 普段の開発はホストで直接`npm run dev`する(Next.jsの公式ドキュメントの推奨)。
  # このサービスはDocker上での動作確認をしたい時だけ`docker compose --profile frontend up`で起動する
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Next.jsのサーバーからLaravelへのURL(/api・/sanctumの中継と、Server Componentからの取得で使う)
      API_INTERNAL_URL: "http://app:8080"
    volumes:
      - ./frontend:/app
      # ホストのnode_modules・.nextでコンテナ内のもの(Linux用のバイナリを含む)を上書きしないよう、
      # 匿名ボリュームとして分離する
      - /app/node_modules
      - /app/.next
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tech_match
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時にテスト用DB(tech_match_test)を作成する
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
